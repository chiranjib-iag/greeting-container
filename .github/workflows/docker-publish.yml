name: Build and publish container image

# Build the image, verify it serves /healthz, then push it to GHCR.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sample-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v1
            type=ref,event=tag
            type=sha,format=short

      # Build locally first (no push) so we can smoke-test the image.
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sample-app:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves /healthz
        run: |
          docker run -d --name verify -p 8080:8080 sample-app:verify
          echo "Waiting for the app to come up..."
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "" && echo "Healthcheck passed."
              ok=1
              break
            fi
            sleep 2
          done
          echo "--- / endpoint ---"
          curl -fsS http://localhost:8080/ || true
          echo ""
          echo "--- running as user (expect appuser) ---"
          docker exec verify whoami
          docker rm -f verify
          if [ "${ok:-0}" != "1" ]; then
            echo "Healthcheck never succeeded" >&2
            exit 1
          fi

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
